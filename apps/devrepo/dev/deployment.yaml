apiVersion: v1
kind: Namespace
metadata:
  name: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devrepo
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devrepo
  template:
    metadata:
      labels:
        app: devrepo
    spec:
      containers:
      - name: devrepo
        image: us-central1-docker.pkg.dev/central-pipeline-515411/poc-repo/devrepo:2a35817b27acb83f4ca9b564ee9cf91201b5e884
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: devrepo-service
  namespace: dev
spec:
  selector:
    app: devrepo
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
